services:
  ollama:
    image: ollama/ollama:latest
    container_name: careerfit-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  api:
    build: ./api
    container_name: careerfit-ai-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - EMBEDDING_DEVICE=cpu
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - resume_uploads:/tmp/careerfit_ai/uploads
      - resume_outputs:/tmp/careerfit_ai/outputs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: careerfit-ai-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
  resume_uploads:
  resume_outputs: